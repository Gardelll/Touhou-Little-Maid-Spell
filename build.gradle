import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'net.magicterra.stagewright' version '0.1.0-snapshot+1.21.1'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url = 'https://nexus.gardel.top/repository/maven-releases'
        content { includeGroup 'net.magicterra' }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name "cursemaven"
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://code.redspace.io/releases"
        content {
            includeGroup "io.redspace"
        }
    }
    maven {
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        url "https://maven.theillusivec4.top"
        content {
            includeGroup("top.theillusivec4.curios")
        }
    }
    maven {
        url 'https://maven.blamejared.com'
        content {
            includeGroup("com.hollingsworth.ars_nouveau")
            includeGroup("com.hollingsworth.nuggets")
        }
    }
    maven {
        url "https://maven.minecraftforge.net/"
        content {
            includeGroup("com.github.glitchfiend")
        }
    }
}

base {
    // 打包制品以 mod_id 命名添加版本后缀
    archivesName = "$mod_id-$minecraft_version"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// coremod 源集是 hurt 头部插桩的 Java coremod，单独打成 FMLModType: LIBRARY 的 jar（NeoForge 只从 PLUGIN 层加载 ICoreMod），
// 发布时嵌套进主 jar，开发运行时以 jar 形式放进 main 的运行时类路径。
sourceSets {
    coremod
}

// coremod 作为本项目的一个特性变体，主 jar 通过 jarJar 按能力名引用它；不随 maven 发布
def coremodCapability = "${mod_group_id}:${mod_id}_coremod"
java {
    registerFeature('coremod') {
        usingSourceSet(sourceSets.coremod)
        capability(mod_group_id, "${mod_id}_coremod", mod_version)
    }
}
components.java.withVariantsFromConfiguration(configurations.coremodApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.coremodRuntimeElements) { skip() }

tasks.named('coremodJar', Jar) {
    archiveBaseName = "${mod_id}_coremod"
    archiveClassifier = ''
    manifest.attributes(
            'FMLModType': 'LIBRARY',
            'Automatic-Module-Name': "${mod_id}.coremod"
    )
}

// StageWright 测试套件：插件建 testmod 源集与各拓扑的运行，场景文件在 src/testmod/resources/stagewright/scenes/
stagewright {
    tests {
        neoforge {
            // 测试按串行设计（共享配置项、全局注册表与游戏规则）；经系统属性关闭并行
            systemProperties.put('junit.jupiter.execution.parallel.enabled', 'false')
            // 场景各用一份运行目录、各占一个游戏进程，可同时跑；带客户端的场景仍逐个跑
            maxParallelScenes = 3
        }
    }
}

neoForge {
    // 指定 NeoForge 版本
    version = project.neo_version
    addModdingDependenciesTo sourceSets.coremod

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 这个文件会自动加载
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // 导出混入后的 class 字节码以供分析调试
            systemProperty 'mixin.debug.export', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 妖怪们的归家 1.21 非官方移植版：编译依赖它本身；弹幕与符卡在它内嵌的 danmaku_api 里，这些内嵌库没有公开 maven，从移植版 jar 里解出来一并编译。
// 官方 1.21 版妖怪们的归家与妖怪们的飨宴只和咖啡厅结构有关，不参与编译
configurations {
    yhPort { transitive = false }
    compileOnly.extendsFrom yhPort
}
def extractYhPortLibs = tasks.register('extractYhPortLibs', Sync) {
    from({ zipTree(configurations.yhPort.singleFile) }) {
        include(['danmaku_api', 'fast_projectile_api', 'Registrate', 'l2library', 'l2core'].collect { "META-INF/jarjar/${it}-*.jar" })
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('yh-port-libs')
}

dependencies {
    // hurt 头部插桩 coremod：发布时嵌套进主 jar；开发运行时放在类路径上，由 FML 按 jar 清单识别为 LIBRARY
    jarJar(project(':')) {
        capabilities { requireCapability(coremodCapability) }
    }
    runtimeOnly files(tasks.named('coremodJar'))

    // 车万女仆
    implementation("curse.maven:touhou-little-maid-355044:${tlm_curse_version}") {
        exclude group: "maven.modrinth", module: "sodium"
        exclude group: "maven.modrinth", module: "embeddium"
    }
    // Iron 的法术与魔导书
    implementation("io.redspace:irons_spellbooks:${minecraft_version}-${irons_spells_version}")
    // Iron's Lib
    implementation("maven.modrinth:irons-lib:${minecraft_version}-${irons_lib_version}")
    // 新生魔艺
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")
    // PSI
    implementation("curse.maven:psi-241665:${psi_version}")
    // Goety
    implementation("maven.modrinth:goety:${goety_version}")
    // UsefulMagic（弹幕/魔法阵战斗，Kotlin）+ 其前置
    implementation("maven.modrinth:usefulmagic:${usefulmagic_version}")
    implementation("maven.modrinth:cooparticlesapi:${cooparticlesapi_version}")
    implementation("maven.modrinth:kotlin-for-forge:${kotlinforforge_version}")
    // SlashBlade Resharped
    implementation("maven.modrinth:slashblade-resharped:${slashblade_version}")
    // 妖怪们的归家非官方移植版：编译时依赖它及其内嵌库
    yhPort("maven.modrinth:youkaishomecoming-unofficial-port:${yh_port_version}")
    compileOnly fileTree(layout.buildDirectory.dir('yh-port-libs')) { include '*.jar' }.builtBy(extractYhPortLibs)

    // 下面是一些前置
    implementation("vazkii.patchouli:Patchouli:${patchouli_version}")
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")
    implementation("maven.modrinth:jade:${jade_version}")
    // JEI：只用于状态栏避让排除区域
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    runtimeOnly("maven.modrinth:appleskin:${appleskin_version}")
    runtimeOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")
    runtimeOnly("maven.modrinth:playeranimator:${playeranimator_version}")
    runtimeOnly("maven.modrinth:c2me-neoforge:${c2me_version}")
    // 妖怪们的飨宴（妖怪们的归家 3.0.8 与农夫乐事 1.3 不兼容，开发环境换用它）；
    // 带 -PyhPort 时换成妖怪们的归家非官方移植版（两者含同名包，不能同时装）
    if (project.hasProperty('yhPort')) {
        runtimeOnly("maven.modrinth:youkaishomecoming-unofficial-port:${yh_port_version}")
    } else {
        runtimeOnly("maven.modrinth:gensokyo-delight-youkais-feasts:${youkaisfeasts_version}")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            neo_version                     : neo_version,
            neo_version_range               : neo_version_range,
            loader_version_range            : loader_version_range,
            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
            mod_description                 : mod_description,
            touhou_little_maid_version_range: touhou_little_maid_version_range,
            irons_spells_version_range      : irons_spells_version_range,
            ars_nouveau_version_range       : ars_nouveau_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

createMinecraftArtifacts {
    dependsOn generateModMetadata
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// 让 IDEA 强制下载前置库的源代码，方便开发时查看
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogForVersion(String version) {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return version
    }

    def lines = changelogFile.readLines()
    def versionHeader = "## ${version}"
    def inVersionSection = false
    def changelog = new StringBuilder()

    for (line in lines) {
        if (line.trim() == versionHeader) {
            inVersionSection = true
            continue
        }
        if (inVersionSection) {
            if (line.trim() == "---") {
                break
            }
            changelog.append(line).append('\n')
        }
    }

    return changelog.toString().trim()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'touhou-little-maid-spell'
    // versionNumber = "1.0.0"
    versionType = version_type
    uploadFile = jar
    changelog = getChangelogForVersion(mod_version)
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    dependencies {
        required.project "touhou-little-maid"
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    def mainFile = upload(curseforge_project, jar)
    mainFile.changelog = getChangelogForVersion(mod_version)
    mainFile.releaseType = version_type
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('neoforge')
    mainFile.addRequirement('touhou-little-maid')
    mainFile.withAdditionalFile(sourcesJar)
}

tasks.register('publishMod') {
    group = 'publishing'
    description = 'Publishes the mod to both Modrinth and CurseForge'
    dependsOn 'modrinth', 'publishCurseForge'
}
