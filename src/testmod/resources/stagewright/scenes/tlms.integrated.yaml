# 集成服：客户端自建单人世界，测试与客户端同一 JVM
topology: integratedServer
files:
  # 跳过首次启动的辅助功能引导页、失焦不暂停、静音
  options.txt: |
    onboardAccessibility:false
    pauseOnLostFocus:false
    narrator:0
    soundCategory_master:0.0
  # 关闭 FML 早期加载窗口（该窗口在本机桌面上会卡在 glfwShowWindow）
  config/fml.toml: |
    earlyWindowControl = false
