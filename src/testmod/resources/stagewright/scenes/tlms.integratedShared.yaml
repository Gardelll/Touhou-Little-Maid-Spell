# 集成服，归隐之地按共享模式配置
topology: integratedServer
files:
  # 跳过首次启动的辅助功能引导页、失焦不暂停、静音
  options.txt: |
    onboardAccessibility:false
    pauseOnLostFocus:false
    narrator:0
    soundCategory_master:0.0
  # 关闭 FML 早期加载窗口（该窗口在本机桌面上会卡在 glfwShowWindow）
  config/fml.toml: |
    earlyWindowControl = false
  # 共享归隐之地模式：关闭私人维度，其余配置项由 NeoForge 补默认值
  config/touhou_little_maid_spell/retreat.toml: |
    [retreat_dimension]
    	enablePrivateDimensions = false
    	enableSharedQuotaLimit = true
